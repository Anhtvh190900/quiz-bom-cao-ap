<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Bơm cao áp</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#1c2230; --muted:#5d6678; --line:#dfe3ea;
    --accent:#1f5fd6; --accent-ink:#fff; --ok:#16794a; --okbg:#e3f5ec; --bad:#b4261c; --badbg:#fdeaea; --warn:#8a5a00; --warnbg:#fff4d6;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#10141c; --card:#1a2030; --ink:#e8ecf4; --muted:#9aa4b8; --line:#2c3448; --accent:#6aa0ff; --accent-ink:#0b1220;
      --ok:#5fd29b; --okbg:#12301f; --bad:#ff8a80; --badbg:#3a1714; --warn:#ffcf66; --warnbg:#3a2d0c;}
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,"Segoe UI",Roboto,sans-serif}
  body.locked{user-select:none;-webkit-user-select:none}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
  h1{font-size:1.5rem;margin:0 0 4px} h2{font-size:1.15rem;margin:0 0 12px}
  .muted{color:var(--muted)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 16px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .opt-set label{display:flex;gap:10px;align-items:center;margin:8px 0;cursor:pointer}
  input[type=number]{width:80px;font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  .notice{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:10px 14px;font-size:.92rem;margin:12px 0}
  .topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;font-variant-numeric:tabular-nums}
  .pill.warn{color:var(--bad);border-color:var(--bad)}
  .qimg{display:block;max-width:100%;max-height:300px;margin:12px 0;border-radius:8px;background:#fff;border:1px solid var(--line)}
  .qtext{font-size:1.1rem;font-weight:600;margin:0 0 8px}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px 14px}
  .opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.85rem}
  .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
  .opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .opt.ok{border-color:var(--ok);background:var(--okbg)} .opt.bad{border-color:var(--bad);background:var(--badbg)}
  .grid{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0}
  .grid button{width:38px;height:38px;padding:0;font-variant-numeric:tabular-nums}
  .grid button.done{background:color-mix(in srgb,var(--accent) 18%,var(--card));border-color:var(--accent)}
  .grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
  .nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px;flex-wrap:wrap}
  .overlay{position:fixed;inset:0;z-index:100;background:#0b1220;color:#fff;display:none;place-items:center;text-align:center;padding:24px}
  .overlay.show{display:grid}
  .overlay .box{max-width:520px}
  .overlay.modal{background:rgba(10,15,25,.72);color:var(--ink)}
  .overlay.modal .box{width:min(92vw,420px)}
  .overlay.modal h2{color:var(--ink);font-size:1.25rem}
  .overlay h2{font-size:1.6rem;color:#ffd166}
  .score{font-size:2.4rem;font-weight:800}
  .rev{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
  .tag{display:inline-block;font-size:.78rem;border-radius:6px;padding:2px 8px;margin-left:6px;background:var(--warnbg);color:var(--warn)}
  .hide{display:none!important}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
  .fields label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.92rem}
  .fields input{font:inherit;font-weight:400;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
  @media (max-width:560px){.fields{grid-template-columns:1fr}}
  .sendbox{border-radius:8px;padding:10px 14px;margin:12px 0;background:var(--warnbg);color:var(--warn)}
  .sendbox.ok{background:var(--okbg);color:var(--ok)} .sendbox.err{background:var(--badbg);color:var(--bad)}
  .sendbox button{margin:6px 6px 0 0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<div class="overlay modal" id="confirmBox" role="dialog" aria-modal="true">
  <div class="box card">
    <h2>Nộp bài?</h2>
    <p id="confirmMsg"></p>
    <div class="row" style="justify-content:center"><button class="primary" id="yes">Nộp bài</button><button id="no">Làm tiếp</button></div>
  </div>
</div>
<div id="errBanner" class="hide" style="position:fixed;left:0;right:0;bottom:0;z-index:200;background:#b4261c;color:#fff;padding:8px 12px;font-size:.85rem"></div>

<div class="overlay" id="overlay" role="alertdialog" aria-live="assertive">
  <div class="box">
    <h2>⚠ Bạn đã rời khỏi bài thi</h2>
    <p id="ovMsg"></p>
    <p>Nội dung câu hỏi đang được ẩn. Bấm nút bên dưới để quay lại toàn màn hình và làm tiếp.</p>
    <button class="primary" id="ovBtn">Quay lại bài thi</button>
  </div>
</div>

<script>

/* ===== CẤU HÌNH KHÓA ===== */
const MAX_VIOLATIONS = 3;   // số lần rời bài thi tối đa trước khi tự nộp bài
const DEFAULT_MINUTES = 30; // thời gian làm bài mặc định (phút)
const VERSION = '3';        // tăng số này mỗi lần sửa để biết người làm đang mở bản nào
/* Nơi lưu kết quả. Ưu tiên Google Sheet: dán link Web app của Apps Script vào SHEET_URL
   (xem file huong-dan-google-sheet.md). Để trống thì gửi về email RESULT_EMAIL qua formsubmit.co. */
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbxDQLInA_H2FWMuJesxztgUtN3HOPXSzfKYkNd60GWVCmJiN_3M8o6w6c-XK6rhiM1S/exec';
const RESULT_EMAIL = 'anht190900@gmail.com';
const ADMIN = new URLSearchParams(location.search).has('thu'); // thêm ?thu=1 vào link để thấy tùy chọn khi thử

const $ = (s) => document.querySelector(s);
const app = $('#app');
const overlay = $('#overlay');
const state = {running:false, locked:true, list:[], answers:[], cur:0, violations:0, endAt:0, timer:null, lastViolation:0, secs:0};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const LET = 'ABCDEFGH';

/* ---------- Màn hình bắt đầu ---------- */
function showStart(){
  document.body.classList.remove('locked');
  app.innerHTML = `
  <div class="card">
    <h1>Quiz ôn tập: Bơm cao áp diesel</h1>
    <p class="muted">${QUESTIONS.length} câu trắc nghiệm (đã loại các câu trùng trong file gốc).</p>
    <div class="fields">
      <label>Họ và tên <input type="text" id="stName" autocomplete="off" maxlength="80" placeholder="Nguyễn Văn A"></label>
      <label>Lớp <input type="text" id="stClass" autocomplete="off" maxlength="30" placeholder="VD: CĐ Ô tô 23A"></label>
    </div>
    ${ADMIN ? `<div class="opt-set">
      <label><input type="checkbox" id="optLock" checked> <span><b>Chế độ khóa</b>: vào toàn màn hình, ẩn đề khi rời khỏi, tự nộp bài sau ${MAX_VIOLATIONS} lần vi phạm</span></label>
      <label><input type="checkbox" id="optShuffle" checked> Đảo thứ tự câu hỏi và đáp án</label>
      <label>Thời gian làm bài: <input type="number" id="optMin" min="0" max="180" value="${DEFAULT_MINUTES}"> phút (0 = không giới hạn)</label>
    </div>` : `<p class="muted">Thời gian làm bài: ${DEFAULT_MINUTES} phút. Bài thi chạy toàn màn hình; rời khỏi bài ${MAX_VIOLATIONS} lần sẽ tự động nộp. Kết quả được gửi tự động cho giáo viên khi nộp bài.</p>`}
    <div class="notice">Không đóng trang hoặc chuyển sang cửa sổ khác trong lúc làm bài. Mỗi lần rời khỏi bài sẽ bị ghi nhận.</div>
    <div class="row"><button class="primary" id="btnStart">Bắt đầu làm bài</button><span id="stErr" style="color:var(--bad)"></span></div>
    <p class="muted" style="font-size:.75rem;margin:14px 0 0">Phiên bản ${VERSION}</p>
  </div>`;
  $('#btnStart').onclick = startExam;
}

/* ---------- Bắt đầu ---------- */
async function startExam(){
  const name = $('#stName').value.trim(), cls = $('#stClass').value.trim();
  if (name.length < 2 || !cls){ $('#stErr').textContent = 'Vui lòng nhập họ tên và lớp.'; return; }
  state.student = {name, cls};
  state.sent = false; state.startedAt = Date.now();
  state.locked = ADMIN ? $('#optLock').checked : true;
  const doShuffle = ADMIN ? $('#optShuffle').checked : true;
  const mins = ADMIN ? Math.max(0, parseInt($('#optMin').value,10) || 0) : DEFAULT_MINUTES;
  state.list = QUESTIONS.map((q,i)=>{
    const idx = q.o.map((_,k)=>k);
    const order = doShuffle ? shuffle(idx) : idx;
    return {q:q.q, img:q.img, unsure:q.unsure, opts:order.map(k=>q.o[k]), a: order.indexOf(q.a)};
  });
  if (doShuffle) state.list = shuffle(state.list);
  state.answers = state.list.map(()=>null);
  state.cur = 0; state.violations = 0; state.secs = mins*60; state.endAt = mins ? Date.now()+mins*60000 : 0;
  state.running = true;
  if (state.locked) engage();      // không chờ: một số trình duyệt (điện thoại) không bao giờ trả lời yêu cầu toàn màn hình
  render();
  state.timer = setInterval(tick, 500);
}

/* ---------- Khóa ---------- */
function engage(){
  document.body.classList.add('locked');
  window.addEventListener('beforeunload', onBeforeUnload);
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('blur', onBlur);
  document.addEventListener('contextmenu', stop);
  ['copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.addEventListener(ev, stop));
  document.addEventListener('keydown', onKey, true);
  try {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (req) { const p = req.call(el, {navigationUI:'hide'}); if (p && p.catch) p.catch(()=>{}); }
  } catch(e){}
  try {
    if (navigator.keyboard && navigator.keyboard.lock) {
      const p = navigator.keyboard.lock(['Escape','KeyW','KeyT','KeyN','F5','F11','F12']); if (p && p.catch) p.catch(()=>{});
    }
  } catch(e){}
}
function release(){
  const safe = (f) => { try { f(); } catch(e){} };
  safe(()=>document.body.classList.remove('locked'));
  safe(()=>window.removeEventListener('beforeunload', onBeforeUnload));
  safe(()=>document.removeEventListener('fullscreenchange', onFsChange));
  safe(()=>document.removeEventListener('visibilitychange', onVisibility));
  safe(()=>window.removeEventListener('blur', onBlur));
  safe(()=>document.removeEventListener('contextmenu', stop));
  safe(()=>['copy','cut','paste','dragstart','selectstart'].forEach(ev=>document.removeEventListener(ev, stop)));
  safe(()=>document.removeEventListener('keydown', onKey, true));
  safe(()=>overlay.classList.remove('show'));
  safe(()=>{ const m=$('#confirmBox'); if(m) m.classList.remove('show'); });
  safe(()=>{ navigator.keyboard && navigator.keyboard.unlock && navigator.keyboard.unlock(); });
  safe(()=>{ if (document.fullscreenElement && document.exitFullscreen) { const p=document.exitFullscreen(); if(p&&p.catch) p.catch(()=>{}); } });
}
function stop(e){ e.preventDefault(); }
function onBeforeUnload(e){ if(state.running){ e.preventDefault(); e.returnValue=''; } }
function onKey(e){
  if (!e || typeof e.key !== 'string') return;
  const k = e.key.toLowerCase();
  const bad = e.key==='F12' || e.key==='F5' || e.key==='F11' || e.key==='Escape' ||
    (e.ctrlKey && ['r','u','s','p','w','t','n','f','l','a','c','v','x'].includes(k)) ||
    (e.ctrlKey && e.shiftKey && ['i','j','c','n','t'].includes(k)) ||
    (e.altKey && ['arrowleft','arrowright'].includes(k));
  if (bad){ e.preventDefault(); e.stopPropagation(); }
}
function violation(reason){
  if(!state.running || !state.locked) return;
  const now = Date.now();
  if (now - state.lastViolation < 1500) return;   // gộp các sự kiện đến cùng lúc thành 1 lần
  state.lastViolation = now;
  state.violations++;
  updateBar();
  if (state.violations >= MAX_VIOLATIONS){ finish('Bạn đã vi phạm '+MAX_VIOLATIONS+' lần nên bài thi được tự động nộp.'); return; }
  $('#ovMsg').textContent = reason+' (lần '+state.violations+'/'+MAX_VIOLATIONS+'). Vi phạm lần thứ '+MAX_VIOLATIONS+' bài sẽ tự động nộp.';
  overlay.classList.add('show');
}
function onFsChange(){ if(state.running && !document.fullscreenElement) violation('Bạn đã thoát chế độ toàn màn hình'); }
function onVisibility(){ if(state.running && document.hidden) violation('Bạn đã chuyển sang cửa sổ hoặc thẻ khác'); }
function onBlur(){ if(state.running && !document.hidden) setTimeout(()=>{ if(state.running && !document.hasFocus()) violation('Cửa sổ bài thi bị mất tiêu điểm'); },300); }
$('#ovBtn').onclick = async () => {
  try { await document.documentElement.requestFullscreen({navigationUI:'hide'}); } catch(e){}
  window.focus();
  overlay.classList.remove('show');
};

/* ---------- Đồng hồ ---------- */
function fmt(s){const m=Math.floor(s/60), r=s%60;return String(m).padStart(2,'0')+':'+String(r).padStart(2,'0')}
function tick(){
  if(!state.running) return;
  if(state.endAt){
    const left = Math.max(0, Math.ceil((state.endAt-Date.now())/1000));
    const el = $('#timer'); if(el){ el.textContent = '⏱ '+fmt(left); el.classList.toggle('warn', left<=60); }
    if(left<=0) finish('Hết giờ làm bài.');
  }
}
function updateBar(){ const v=$('#viol'); if(v){ v.textContent='Vi phạm: '+state.violations+'/'+MAX_VIOLATIONS; v.classList.toggle('warn', state.violations>0);} }

/* ---------- Hiển thị câu hỏi ---------- */
function render(){
  const q = state.list[state.cur], n = state.list.length;
  const answered = state.answers.filter(a=>a!==null).length;
  app.innerHTML = `
  <div class="topbar">
    <div class="row"><span class="pill">Câu ${state.cur+1}/${n}</span><span class="pill">Đã làm ${answered}/${n}</span></div>
    <div class="row">
      ${state.locked?`<span class="pill ${state.violations?'warn':''}" id="viol">Vi phạm: ${state.violations}/${MAX_VIOLATIONS}</span>`:''}
      ${state.endAt?`<span class="pill" id="timer">⏱ --:--</span>`:''}
    </div>
  </div>
  <div class="card">
    <p class="qtext">${state.cur+1}. ${esc(q.q)}</p>
    ${q.img?`<img class="qimg" src="${q.img}" alt="Hình minh họa câu ${state.cur+1}">`:''}
    <div id="opts">${q.opts.map((o,i)=>`<button class="opt ${state.answers[state.cur]===i?'sel':''}" data-i="${i}"><span class="k">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div class="nav">
      <button id="prev" ${state.cur===0?'disabled':''}>← Câu trước</button>
      <button id="next" ${state.cur===n-1?'disabled':''}>Câu sau →</button>
    </div>
  </div>
  <div class="grid">${state.list.map((_,i)=>`<button data-g="${i}" class="${state.answers[i]!==null?'done':''} ${i===state.cur?'cur':''}">${i+1}</button>`).join('')}</div>
  <div class="row"><button class="primary" id="submit">Nộp bài</button><span class="muted" id="subMsg"></span></div>
  <p class="muted" style="font-size:.75rem">Phiên bản ${VERSION}</p>`;
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{state.answers[state.cur]=+b.dataset.i; const y=window.scrollY; render(); window.scrollTo(0,y);});
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.cur=+b.dataset.g;render();window.scrollTo(0,0);});
  $('#prev').onclick=()=>{state.cur--;render();window.scrollTo(0,0);};
  $('#next').onclick=()=>{state.cur++;render();window.scrollTo(0,0);};
  $('#submit').onclick=askSubmit;
  tick();
}
function askSubmit(){
  const left = state.answers.filter(a=>a===null).length;
  $('#confirmMsg').innerHTML = left ? `Bạn còn <b>${left}</b> câu chưa làm. Nộp bài bây giờ?` : 'Bạn đã trả lời tất cả các câu. Nộp bài?';
  $('#confirmBox').classList.add('show');
  $('#yes').onclick = () => { $('#confirmBox').classList.remove('show'); finish(''); };
  $('#no').onclick = () => { $('#confirmBox').classList.remove('show'); };
}

/* ---------- Kết quả ---------- */
function showErr(msg){
  try { const b=$('#errBanner'); b.textContent = msg; b.classList.remove('hide'); } catch(e){}
}
window.addEventListener('error', (e)=>showErr('Lỗi: '+(e.message||'không rõ')));
window.addEventListener('unhandledrejection', (e)=>showErr('Lỗi: '+((e.reason&&e.reason.message)||e.reason||'không rõ')));

function finish(note){
  if(!state.running) return;
  state.running = false;
  try { clearInterval(state.timer); } catch(e){}
  release();
  try { renderResult(note); }
  catch(e){
    showErr('Lỗi hiển thị kết quả: '+e.message);
    const n = state.list.length, right = state.list.reduce((s,q,i)=>s+(state.answers[i]===q.a?1:0),0);
    app.innerHTML = '<div class="card"><h1>Kết quả</h1><div class="sendbox" id="sendBox">Đang gửi kết quả cho giáo viên…</div><div class="score">'+right+'/'+n+'</div><div class="row"><button class="primary" onclick="location.reload()">Làm lại</button></div></div>';
  }
  window.scrollTo(0,0);
  try { sendResult(note); } catch(e){ showErr('Lỗi gửi kết quả: '+e.message); }
}
function renderResult(note){
  const n = state.list.length;
  const right = state.list.reduce((s,q,i)=>s+(state.answers[i]===q.a?1:0),0);
  app.innerHTML = `
  <div class="card">
    <h1>Kết quả</h1>
    <p class="muted"><b>${esc(state.student.name)}</b> · Lớp ${esc(state.student.cls)}</p>
    ${note?`<div class="notice">${esc(note)}</div>`:''}
    <div class="sendbox" id="sendBox">Đang gửi kết quả cho giáo viên…</div>
    <div class="score">${right}/${n} <span class="muted" style="font-size:1.1rem">(${Math.round(right/n*100)}%)</span></div>
    <p class="muted">Số lần vi phạm: ${state.violations}. Đáp án đúng được tô xanh bên dưới.</p>
    <div class="row"><button class="primary" id="again">Làm lại</button></div>
    ${state.list.map((q,i)=>{
      const mine = state.answers[i], ok = mine===q.a;
      return `<div class="rev">
        <p class="qtext">${i+1}. ${esc(q.q)} ${ok?'<span style="color:var(--ok)">✔</span>':'<span style="color:var(--bad)">✘</span>'}</p>
        ${q.img?`<img class="qimg" src="${q.img}" alt="">`:''}
        ${q.opts.map((o,k)=>`<div class="opt ${k===q.a?'ok':(k===mine?'bad':'')}"><span class="k">${LET[k]}</span><span>${esc(o)}${k===mine?' <i class="muted">(bạn chọn)</i>':''}</span></div>`).join('')}
        ${mine===null?'<p class="muted">Bạn chưa trả lời câu này.</p>':''}
      </div>`;}).join('')}
  </div>`;
  $('#again').onclick = showStart;
}

/* ---------- Gửi kết quả về email ---------- */
function buildReport(note){
  const n = state.list.length;
  const right = state.list.reduce((s,q,i)=>s+(state.answers[i]===q.a?1:0),0);
  const mins = Math.max(1, Math.round((Date.now()-state.startedAt)/60000));
  const wrong = state.list.map((q,i)=>({q,i,mine:state.answers[i]})).filter(x=>x.mine!==x.q.a).map(x =>
    'Câu '+(x.i+1)+': '+x.q.q+'\n   Chọn: '+(x.mine===null?'(bỏ trống)':x.q.opts[x.mine])+'\n   Đáp án: '+x.q.opts[x.q.a]);
  return {
    name: state.student.name, cls: state.student.cls,
    score: right+'/'+n, percent: Math.round(right/n*100)+'%',
    violations: state.violations, minutes: mins, note: note||'',
    wrong: wrong.length ? wrong.join('\n') : '(không sai câu nào)'
  };
}
function fetchT(url, opts, ms){
  if (typeof AbortController === 'undefined') return fetch(url, opts);
  const ac = new AbortController(); const t = setTimeout(()=>ac.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal: ac.signal})).finally(()=>clearTimeout(t));
}
async function sendResult(note){
  const box = $('#sendBox'); if(!box || state.sent) return;
  const r = buildReport(note);
  const text = ['Quiz Bơm cao áp diesel','Họ tên: '+r.name,'Lớp: '+r.cls,'Điểm: '+r.score+' ('+r.percent+')','Số lần vi phạm: '+r.violations,'Thời gian làm: '+r.minutes+' phút',r.note?('Ghi chú: '+r.note):'','','Các câu sai/bỏ trống:',r.wrong].filter(x=>x!==null).join('\n');
  const fallback = () => {
    box.className = 'sendbox err';
    box.innerHTML = 'Chưa gửi được kết quả (có thể do mất mạng). Bạn hãy bấm một trong các nút dưới đây rồi báo giáo viên.<br>'
      + '<button id="rt">Gửi lại</button>'
      + '<a href="mailto:'+RESULT_EMAIL+'?subject='+encodeURIComponent('Kết quả quiz - '+r.name+' - '+r.cls)+'&body='+encodeURIComponent(text)+'"><button>Gửi bằng ứng dụng email</button></a>'
      + '<button id="cp">Sao chép kết quả</button>';
    $('#rt').onclick = () => { box.className='sendbox'; box.textContent='Đang gửi lại…'; sendResult(note); };
    $('#cp').onclick = async () => { try{ await navigator.clipboard.writeText(text); $('#cp').textContent='Đã sao chép'; }catch(e){ prompt('Sao chép nội dung này:', text); } };
  };
  try {
    if (SHEET_URL) {
      // Apps Script: gửi text/plain + no-cors để tránh preflight; phản hồi bị ẩn nên coi là gửi xong nếu không lỗi mạng.
      await fetchT(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({name:r.name, cls:r.cls, score:r.score, percent:r.percent, violations:r.violations, minutes:r.minutes, note:r.note, wrong:r.wrong})}, 20000);
      state.sent = true; box.className='sendbox ok'; box.textContent='✔ Đã ghi kết quả vào bảng tổng hợp của giáo viên.'; return;
    }
    const res = await fetchT('https://formsubmit.co/ajax/'+RESULT_EMAIL, {
      method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'},
      body: JSON.stringify({
        _subject:'Kết quả quiz - '+r.name+' - '+r.cls, _template:'table', _captcha:'false',
        'Họ tên':r.name, 'Lớp':r.cls, 'Điểm':r.score+' ('+r.percent+')', 'Số lần vi phạm':r.violations,
        'Thời gian làm (phút)':r.minutes, 'Ghi chú':r.note||'-', 'Các câu sai':r.wrong
      })
    }, 20000);
    const j = await res.json().catch(()=>({}));
    if (res.ok && String(j.success) !== 'false'){ state.sent = true; box.className='sendbox ok'; box.textContent='✔ Đã gửi kết quả cho giáo viên.'; }
    else fallback();
  } catch(e){ fallback(); }
}

showStart();
</script>
</body>
</html>
